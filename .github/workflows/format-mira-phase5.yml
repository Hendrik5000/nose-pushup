name: Format Mira Phase 5

on:
  push:
    branches:
      - mira-device-control-phase5-ui

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'chore: format Mira Phase 5 files'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Format files reported by CI
        run: npx prettier --write src/components/mira/MiraDevicesPage.tsx src/lib/mira-device-control.functions.ts src/lib/mira-device-control.server.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/mira/MiraDevicesPage.tsx src/lib/mira-device-control.functions.ts src/lib/mira-device-control.server.ts
          git commit -m "chore: format Mira Phase 5 files"
          git push
