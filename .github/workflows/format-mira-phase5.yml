name: Format Mira Phase 5

on:
  push:
    branches:
      - mira-device-control-phase5-ui
    paths:
      - ".github/workflows/format-mira-phase5.yml"

permissions:
  contents: write

jobs:
  format:
    name: Apply Prettier to Mira files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: mira-device-control-phase5-ui

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Format affected files
        run: npx prettier --write src/components/mira/MiraDevicesPage.tsx src/lib/mira-device-control.functions.ts src/lib/mira-device-control.server.ts

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/mira/MiraDevicesPage.tsx src/lib/mira-device-control.functions.ts src/lib/mira-device-control.server.ts
          git commit -m "style(mira): apply Prettier formatting"
          git push origin HEAD:mira-device-control-phase5-ui
