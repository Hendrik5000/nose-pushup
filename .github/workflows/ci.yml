name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Regression tests
        run: npm test
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID }}

      - name: Verify private game payloads stay out of public build
        run: npx tsx --test tests/private-games-build.test.ts
        env:
          REQUIRE_PRIVATE_GAME_BUILD: "1"

  android-agent:
    name: Android Agent Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Android gateway behavior tests
        working-directory: android-device-agent
        run: |
          gradle :app:testDebugUnitTest --no-daemon
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report_dir = Path("app/build/test-results/testDebugUnitTest")
          expected = {
              "app.alo.miraagent.ConnectionGenerationTest",
              "app.alo.miraagent.ConnectionStartPolicyTest",
              "app.alo.miraagent.PairingClientTest",
              "app.alo.miraagent.GatewayRetryPolicyTest",
          }
          reports = list(report_dir.glob("TEST-*.xml"))
          results = {}
          for report in reports:
              suite = ET.parse(report).getroot()
              name = suite.get("name", "")
              if name in expected:
                  executed = int(suite.get("tests", "0")) - int(suite.get("skipped", "0"))
                  results[name] = executed

          missing = expected - results.keys()
          empty = {name for name, count in results.items() if count < 1}
          if missing or empty:
              raise SystemExit(
                  f"Android gateway tests did not execute: missing={sorted(missing)}, empty={sorted(empty)}"
              )
          print(f"Verified executed Android gateway test classes: {', '.join(sorted(results))}")
          PY
      - name: Build Android debug APK
        working-directory: android-device-agent
        run: gradle :app:assembleDebug --no-daemon
