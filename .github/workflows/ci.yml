name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Regression tests
        run: |
          npm test > /tmp/regression.tap 2>&1; status=$?
          echo "::error::summary: $(grep -c "^not ok" /tmp/regression.tap) not-ok; $(grep -E "^# (tests|pass|fail)" /tmp/regression.tap | tr "\n" " ")"
          grep "^not ok" /tmp/regression.tap | head -8 | while IFS= read -r line; do
            echo "::error::NOTOK: $line"
          done
          END=$(tail -25 /tmp/regression.tap | sed ":a;N;$!ba;s/\n/%0A/g" | tail -c 1200)
          echo "::error::LOGEND: $END"
          exit $status
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID }}
