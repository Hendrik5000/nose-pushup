name: Mira Device Control
on:
  pull_request:
    paths:
      - "windows-agent/**"
      - "android-device-agent/**"
      - "gateway/**"
      - "gateway-cloudflare/**"
      - "docs/device-control-gateway-spec.md"
      - ".github/workflows/mira-device-control.yml"
  push:
    branches: [main]
    paths:
      - "windows-agent/**"
      - "android-device-agent/**"
      - "gateway/**"
      - "gateway-cloudflare/**"
      - "docs/device-control-gateway-spec.md"
      - ".github/workflows/mira-device-control.yml"

permissions:
  contents: read

jobs:
  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  cloudflare-gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway-cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gateway-cloudflare/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  android-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-device-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run Android unit tests
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Build Android debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mira-android-agent-debug
          path: android-device-agent/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  windows-agent:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build Windows agent
        run: dotnet build windows-agent/src/MiraDeviceAgent/MiraDeviceAgent.csproj --configuration Release
      - name: Run Windows agent tests
        run: dotnet test windows-agent/test/MiraDeviceAgent.Tests/MiraDeviceAgent.Tests.csproj --configuration Release
