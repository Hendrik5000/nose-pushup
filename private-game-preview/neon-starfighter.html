<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; img-src 'none';">
<title>Neon Starfighter</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#070b18;color:#e9f2ff;font:16px system-ui,sans-serif;display:grid;place-items:center}.shell{width:min(920px,100%);padding:20px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}.brand{letter-spacing:.16em;text-transform:uppercase;font-size:12px;color:#7dd3fc}.score{display:flex;gap:12px;font-size:13px;color:#a7b6d5}.score b{color:#fff}.panel{position:relative;border:1px solid #263458;border-radius:24px;overflow:hidden;background:radial-gradient(circle at 50% 10%,#19285a,#0b1025 58%,#070b18);box-shadow:0 20px 70px #02040c}.panel:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#fff1 1px,transparent 1px),linear-gradient(90deg,#fff1 1px,transparent 1px);background-size:42px 42px;opacity:.06}.hud{position:absolute;z-index:2;inset:16px;display:flex;justify-content:space-between;pointer-events:none}.tag{height:max-content;padding:8px 10px;border-radius:999px;background:#0b1228cc;border:1px solid #5ee7ff44;font-size:12px}.tag b{color:#67e8f9}.stage{display:block;width:100%;height:min(62vh,560px);min-height:390px}.actions{display:flex;justify-content:center;gap:10px;margin-top:14px}.button{border:1px solid #3a4b78;border-radius:12px;background:#101a35;color:#fff;padding:11px 16px;font-weight:700;cursor:pointer}.button.primary{background:#0891b2;border-color:#67e8f9;color:#00131a}.help{text-align:center;color:#91a1c2;font-size:12px;margin-top:10px}
</style></head>
<body><main class="shell"><div class="top"><div><div class="brand">Alo Arcade</div><h1 style="margin:4px 0 0;font-size:clamp(24px,5vw,38px)">Neon Starfighter</h1></div><div class="score">Welle <b id="wave">1</b> · Punkte <b id="points">0</b></div></div><section class="panel"><div class="hud"><span class="tag">Schild <b id="shield">100%</b></span><span class="tag">Mission <b id="mission">Bereit</b></span></div><canvas id="stage" class="stage" aria-label="Spielfeld"></canvas></section><div class="actions"><button class="button primary" id="start">Mission starten</button><button class="button" id="reset">Highscore löschen</button></div><p class="help">Steuerung: Pfeiltasten oder A/D bewegen · Leertaste feuert · Mobil: tippen und ziehen</p></main>
<script>(()=>{const c=document.querySelector('#stage'),x=c.getContext('2d'),start=document.querySelector('#start'),reset=document.querySelector('#reset'),pointsEl=document.querySelector('#points'),waveEl=document.querySelector('#wave'),shieldEl=document.querySelector('#shield'),missionEl=document.querySelector('#mission');let d=1,w=1,p=0,s=100,running=false,keys=new Set(),ship={x:.5,y:.84},shots=[],enemies=[],last=0,raf=0;const high=()=>Number(localStorage.getItem('alo-neon-highscore')||0);function size(){const q=c.getBoundingClientRect();d=Math.max(1,devicePixelRatio||1);c.width=q.width*d;c.height=q.height*d;x.setTransform(d,0,0,d,0,0)}function spawn(){enemies=[];for(let i=0;i<Math.min(4+w,9);i++)enemies.push({x:.12+i/(Math.min(4+w,9)-1)*.76,y:.14+Math.random()*.18,dx:(Math.random()-.5)*.03,hp:1})}function draw(){const q=c.getBoundingClientRect(),W=q.width,H=q.height;x.clearRect(0,0,W,H);x.fillStyle='#67e8f9';for(let i=0;i<35;i++){const xx=(i*97+Date.now()/35)%W,yy=(i*53)%H;x.globalAlpha=.25+(i%3)/5;x.fillRect(xx,yy,2,2)}x.globalAlpha=1;x.save();x.translate(ship.x*W,ship.y*H);x.fillStyle='#a5f3fc';x.shadowBlur=20;x.shadowColor='#22d3ee';x.beginPath();x.moveTo(0,-18);x.lineTo(13,14);x.lineTo(0,8);x.lineTo(-13,14);x.closePath();x.fill();x.restore();enemies.forEach(e=>{x.fillStyle='#fb7185';x.shadowBlur=14;x.shadowColor='#fb7185';x.beginPath();x.moveTo(e.x*W,(e.y*H)-12);x.lineTo(e.x*W+12,e.y*H+10);x.lineTo(e.x*W-12,e.y*H+10);x.closePath();x.fill()});x.shadowBlur=0;shots.forEach(a=>{x.fillStyle='#fef08a';x.fillRect(a.x*W,a.y*H,3,12)})}function frame(t){const dt=Math.min(32,t-last)/1000;last=t;if(running){if(keys.has('ArrowLeft')||keys.has('a'))ship.x=Math.max(.06,ship.x-dt*.65);if(keys.has('ArrowRight')||keys.has('d'))ship.x=Math.min(.94,ship.x+dt*.65);shots.forEach(a=>a.y-=dt*1.25);shots=shots.filter(a=>a.y>-.1);enemies.forEach(e=>{e.x+=e.dx*dt;e.y+=dt*.025});shots.forEach(a=>enemies.forEach(e=>{if(Math.abs(a.x-e.x)<.035&&Math.abs(a.y-e.y)<.05){e.hp=0;p+=10}}));enemies=enemies.filter(e=>e.hp);if(enemies.some(e=>e.y>.78)){s=Math.max(0,s-20);shieldEl.textContent=s+'%';enemies=[]}if(!enemies.length){w++;waveEl.textContent=w;missionEl.textContent='Welle '+w;spawn()}pointsEl.textContent=p}draw();raf=requestAnimationFrame(frame)}function begin(){running=true;p=0;w=1;s=100;ship.x=.5;waveEl.textContent=w;pointsEl.textContent=p;shieldEl.textContent='100%';missionEl.textContent='Welle 1';spawn();cancelAnimationFrame(raf);raf=requestAnimationFrame(frame);start.textContent='Mission läuft'}function fire(){if(running)shots.push({x:ship.x,y:ship.y-.05})}addEventListener('keydown',e=>{keys.add(e.key);if(e.code==='Space'){e.preventDefault();fire()}if(e.key==='Enter'&&!running)begin()});addEventListener('keyup',e=>keys.delete(e.key));c.addEventListener('pointermove',e=>{if(e.buttons){const q=c.getBoundingClientRect();ship.x=Math.max(.06,Math.min(.94,(e.clientX-q.left)/q.width))}});c.addEventListener('pointerdown',fire);start.onclick=begin;reset.onclick=()=>{localStorage.removeItem('alo-neon-highscore');pointsEl.textContent='0';missionEl.textContent='Highscore gelöscht'};addEventListener('resize',size);size();draw()})();</script></body></html>
